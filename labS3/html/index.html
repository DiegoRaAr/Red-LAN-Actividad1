<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Red LAN - Grupo C</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            /* Centrado total en pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
        }

        .info {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: #00ff88;
            margin: 10px 0;
        }

        .label {
            color: #aaaaaa;
            font-family: Arial, sans-serif;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            margin: 5px 0;
            font-size: 1.1rem;
        }

        hr {
            border: 0;
            border-top: 1px solid #444;
            margin: 20px auto;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Grupo C: Prueba de red Lan</h1>
        
        <div class="info"><span class="label">IP Gateway:</span> 172.16.3.1</div>
        <div class="info"><span class="label">IP DNS:</span> 172.16.3.5</div>
        <div class="info"><span class="label">IP Servidor web:</span> 172.16.3.10</div>

        <hr>
