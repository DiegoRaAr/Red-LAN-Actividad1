<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Prueba grupo C</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #e6e6e6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 35px 45px;
            border-radius: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 2.4em;
            color: #ffffff;
        }

        h2 {
            color: #cfcfcf;
        }

        ul {
            list-style: none;
            padding: 0;
            font-size: 1.2em;
        }

        li {
            margin: 6px 0;
            color: #d4d4d4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Página de Prueba</h1>
        <h2>Integrantes</h2>
        <ul>
            <li>Diego Ramos</li>
            <li>Constanza Viera</li>
            <li>Amalia Veas</li>
            <li>Benjamin Letelier</li>
        </ul>
    </div>

</body>
</html>
